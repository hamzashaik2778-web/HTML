<html>
  <head>
    <title>Registration Form </title>
  </head>
  <body>
    <h1>Registration form </h1>

    <form>
      <fieldset>
        <legend>User personal information</legend>

        <label for="name">Enter your full name</label><br>
        <input type="text" id="name" name="name"><br>

        <label for="email">Enter your email</label><br>
        <input type="email" id="email" name="email"><br>

        <label for="password">Enter your password</label><br>
        <input type="password" id="password" name="password"><br>

        <label for="confirm">confirm your password</label><br>
        <input type="password" id="confirm" name="confirm"><br>
        <br>

        <p style="margin: 0;">Enter your gender</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="others" name="gender" value="others">
        <label for="others">others</label><br>
        <br>

        <label for="address">Enter your Address:</label><br>
        <textarea id="address" name="address" rows="2" cols="20"></textarea><br>

        <button type="submit">sign-up</button>
      </fieldset>
    </form>
  </body>
</html>   SMD..
